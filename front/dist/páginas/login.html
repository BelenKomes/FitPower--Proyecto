<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - FitPower</title>
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/estilo.css">
    <link rel="stylesheet" href="../CSS/estilos condicionales.css">
    <link rel="stylesheet" href="../CSS/fuentes de letra.css">
</head>

<body>
    <div id="contenedor-página" class="container-fluid p-0 vh-100">
        <div id="row-página" class="row g-0 vh-100">
            <div id="contenedor-imagen-login" class="col vh-100 d-none d-lg-block">
                <img src="../assets/imágenes/dark gym wallpaper.png" id="imagen-login" class="w-100 vh-100">
            </div>
            <main class="morado col">
                <div id="contenedor-principal" class="vh-100 d-flex justify-content-center">
                    <div id="contenedor-logo-fitpower-login" class="p-4 text-center">
                        <p class="goldman">FitPower</p>
                    </div>
                    <form id="form-login" class="px-5">
                        <div class="contenedor-input">
                            <input type="text" placeholder="Celular o correo" class="d-block w-100 p-3 mb-5">
                        </div>
                        <div class="contenedor-input">
                            <input type="text" placeholder="Contraseña" class="d-block w-100 p-3 mb-5">
                        </div>
                        <div id="contenedor-botón-enviar" class="text-center">
                            <button type="submit" id="botón-acceder" class="botón-login mb-5 border-0 px-5 py-3 fs-5">Acceder</button>
                        </div>
                    </form>
                    <div id="sección-crear-cuenta" class="text-center">
                        <p class="fs-5">¿No eres miembro?</p>
                        <button id="botón-acceder" class="botón-login mb-5 border-0 px-5 py-3 fs-5">Crear una cuenta</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
